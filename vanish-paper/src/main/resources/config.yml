# Redis connection shared by the Paper backend and the Velocity authority.
redis:
  host: localhost
  port: 6379
  username: ""
  password: ""
  database: 0
  connection-timeout-ms: 5000
  socket-timeout-ms: 5000
  blocking-socket-timeout-ms: 0
  request-timeout-ms: 5000
  retry-initial-ms: 500
  retry-max-ms: 30000

# Set a distinct value for every Paper backend connected to the proxy.
backend-id: paper-local
